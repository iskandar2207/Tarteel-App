<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baca Surah - Al-Qur'an Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div style="max-width: 600px; margin: 0 auto; position: relative">
        <!-- TOMBOL TEMA DI POJOK KIRI ATAS -->
        <button
          onclick="toggleDarkMode()"
          style="
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
          "
        >
          🌙 Tema
        </button>

        <!-- TOMBOL KEMBALI DI POJOK KANAN ATAS -->
        <div style="position: absolute; top: 0; right: 0">
          <a href="index.html" class="btn-kembali" style="position: static">Kembali &#10005;</a>
        </div>

        <div style="text-align: center; padding-top: 10px">
          <h1 id="judul-surah">Memuat...</h1>
          <p id="info-surah" style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 15px"></p>
          <div id="audio-container"></div>

          <div style="margin-top: 10px; display: flex; justify-content: center; gap: 8px">
            <button
              onclick="ubahUkuranFont(2)"
              style="background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 4px 10px; border-radius: 15px; cursor: pointer; font-size: 0.8rem; font-weight: bold"
            >
              A+
            </button>
            <button
              onclick="ubahUkuranFont(-2)"
              style="background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 4px 10px; border-radius: 15px; cursor: pointer; font-size: 0.8rem; font-weight: bold"
            >
              A-
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="ayat-list" class="surat-container">
        <p style="text-align: center; margin-top: 20px">Memuat ayat Al-Qur'an...</p>
      </div>
    </main>

    <script src="surah.js"></script>
  </body>
</html>
